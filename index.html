<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sundial — daily tasks</title>
  <meta name="theme-color" content="#FBF7F1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="app">
    <aside class="nav" aria-label="Main">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20a11 11 0 0 1 22 0z" fill="var(--ring)"/><path d="M3 24h26" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Sundial</span>
      </div>

      <button class="btn-primary new-btn" id="newTaskBtn" type="button">
        <span data-icon="plus"></span> New task <kbd>N</kbd>
      </button>

      <nav class="nav-list">
        <button type="button" data-view="today" class="nav-item"><span data-icon="sun"></span><span class="nav-label">Today</span></button>
        <button type="button" data-view="upcoming" class="nav-item"><span data-icon="upcoming"></span><span class="nav-label">Upcoming</span></button>
        <button type="button" data-view="week" class="nav-item"><span data-icon="week"></span><span class="nav-label">Week</span></button>
        <button type="button" data-view="all" class="nav-item"><span data-icon="list"></span><span class="nav-label">All tasks</span></button>
        <button type="button" data-view="routines" class="nav-item"><span data-icon="repeat"></span><span class="nav-label">Routines</span></button>
        <button type="button" data-view="settings" class="nav-item"><span data-icon="settings"></span><span class="nav-label">Settings</span></button>
      </nav>

      <p class="nav-foot">Saved on this device</p>
    </aside>

    <main class="main" id="main">
      <div id="view" aria-live="polite"></div>
    </main>
  </div>

  <button class="fab" id="fab" type="button" aria-label="New task"><span data-icon="plus"></span></button>

  <!-- Task create / edit -->
  <dialog id="taskDialog" aria-labelledby="dialogTitle">
    <form id="taskForm" novalidate>
      <header class="dlg-head">
        <h2 id="dialogTitle">New task</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close"><span data-icon="x"></span></button>
      </header>

      <div class="dlg-body">
        <label class="sr-only" for="f-title">Title</label>
        <input id="f-title" name="title" class="title-input" type="text" placeholder="What needs doing?" autocomplete="off" maxlength="120" required>

        <label class="sr-only" for="f-desc">Notes</label>
        <textarea id="f-desc" name="description" class="notes-input" rows="2" placeholder="Notes (optional)"></textarea>

        <div class="grid-2">
          <div class="field">
            <label for="f-cat">Category</label>
            <select id="f-cat" name="category"><option value="">None</option></select>
          </div>
          <div class="field">
            <span class="label" id="prio-label">Priority</span>
            <div class="seg-control" role="radiogroup" aria-labelledby="prio-label">
              <label><input type="radio" name="priority" value="" checked><span>None</span></label>
              <label><input type="radio" name="priority" value="low"><span>Low</span></label>
              <label><input type="radio" name="priority" value="medium"><span>Med</span></label>
              <label><input type="radio" name="priority" value="high"><span>High</span></label>
            </div>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="f-date" id="dateLabel">Due date</label>
            <input id="f-date" name="dueDate" type="date">
            <small>Leave empty for today</small>
          </div>
          <div class="field">
            <label for="f-time">Time</label>
            <input id="f-time" name="dueTime" type="time">
          </div>
        </div>

        <div class="field">
          <label for="f-repeat">Repeat</label>
          <select id="f-repeat" name="repeat">
            <option value="none">Does not repeat</option>
            <option value="daily">Every day</option>
            <option value="weekdays">Every weekday</option>
            <option value="days">Selected days of the week</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>

        <fieldset class="field dow-row" id="dowRow" hidden>
          <legend class="label">On these days</legend>
          <div class="dow-chips">
            <label><input type="checkbox" name="dow" value="1"><span>Mon</span></label>
            <label><input type="checkbox" name="dow" value="2"><span>Tue</span></label>
            <label><input type="checkbox" name="dow" value="3"><span>Wed</span></label>
            <label><input type="checkbox" name="dow" value="4"><span>Thu</span></label>
            <label><input type="checkbox" name="dow" value="5"><span>Fri</span></label>
            <label><input type="checkbox" name="dow" value="6"><span>Sat</span></label>
            <label><input type="checkbox" name="dow" value="0"><span>Sun</span></label>
          </div>
        </fieldset>

        <p class="schedule-hint" id="scheduleHint"></p>

        <label class="switch-row" id="activeRow" hidden>
          <span>Routine is active<small>Turn off to pause without deleting</small></span>
          <input type="checkbox" name="isActive" class="switch" checked>
        </label>

        <p class="form-error" id="formError" role="alert"></p>
      </div>

      <footer class="dlg-foot">
        <button type="button" class="btn-danger" id="deleteBtn" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" class="btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn-primary" id="saveBtn">Save task</button>
      </footer>
    </form>
  </dialog>

  <!-- Confirm -->
  <dialog id="confirmDialog" aria-labelledby="confirmTitle">
    <form method="dialog" class="confirm">
      <h2 id="confirmTitle">Are you sure?</h2>
      <p id="confirmText"></p>
      <div class="dlg-foot">
        <span class="spacer"></span>
        <button value="cancel" class="btn-ghost">Cancel</button>
        <button value="ok" class="btn-danger solid" id="confirmOk">Delete</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="data.js"></script>
  <script src="tasks.js"></script>
  <script src="dashboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
